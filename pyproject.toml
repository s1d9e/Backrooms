[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backrooms"
version = "0.1.0"
description = "Red Team network toolkit with honeypot labyrinth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "s1d9e" }]
keywords = ["redteam", "security", "honeypot", "network", "offensive"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "scapy>=2.5.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "structlog>=23.0.0",
    "netifaces>=0.11.0",
    "textual>=0.40.0",
    "docker>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
backrooms = "backrooms.cli:app"

[project.urls]
Repository = "https://github.com/s1d9e/Backrooms"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"backrooms/modules/scanner/port_scan.py" = ["S311", "UP042", "S104"]
"backrooms/modules/scanner/os_fingerprint.py" = ["S311", "UP042"]
"backrooms/modules/scanner/host_discovery.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "scapy.*",
    "netifaces.*",
    "yaml.*",
    "rich.*",
    "textual.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
